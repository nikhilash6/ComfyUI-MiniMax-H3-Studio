name: Temporary native workflow cleanup

on:
  push:
    branches:
      - release/alpha15-final

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove obsolete native workflow and generator path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          generator = Path('tools/generate_workflows.py')
          text = generator.read_text(encoding='utf-8')
          text = text.replace('NATIVE_FAST_T2I_PATH = ROOT / "example_workflows" / "H3_Studio_Native_Fast_T2I.json"\n', '')
          text = text.replace('    native_fast_t2i_text = encoded(polish_native_fast_workflow(build_native_fast_t2i()))\n', '')
          text = text.replace('        (NATIVE_FAST_T2I_PATH, native_fast_t2i_text),\n', '')

          def remove_block(source: str, start: str, end: str) -> str:
              left = source.find(start)
              if left < 0:
                  return source
              right = source.find(end, left)
              if right < 0:
                  raise SystemExit(f'Could not find end marker {end!r} after {start!r}')
              return source[:left] + '\n' + source[right:]

          text = remove_block(text, '\ndef polish_native_fast_workflow(workflow):', '\ndef encoded(value):')
          text = remove_block(text, '\ndef build_native_fast_t2i():', '\ndef main():')
          generator.write_text(text, encoding='utf-8', newline='\n')

          release_check = Path('tools/release_check.py')
          check_text = release_check.read_text(encoding='utf-8')
          check_text = check_text.replace('        "example_workflows/H3_Studio_Native_Fast_T2I.json",\n', '')
          release_check.write_text(check_text, encoding='utf-8', newline='\n')

          native = Path('example_workflows/H3_Studio_Native_Fast_T2I.json')
          if native.exists():
              native.unlink()
          PY

          echo "Remaining native-workflow filename references:"
          grep -R --line-number --exclude='_tmp_remove_native.yml' 'H3_Studio_Native_Fast_T2I' . || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to change."
            exit 0
          fi
          git commit -m "chore(workflows): remove obsolete native fast T2I workflow"
          git push origin HEAD:release/alpha15-final
