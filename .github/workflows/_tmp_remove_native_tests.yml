name: Temporary native workflow test cleanup

on:
  push:
    branches:
      - release/alpha15-final

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove obsolete native workflow integration tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/integration/test_workflow_contract.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('NATIVE_WORKFLOW = ROOT / "example_workflows" / "H3_Studio_Native_Fast_T2I.json"\n', '')
          start = text.find('\ndef load_native_workflow():')
          end = text.find('\ndef test_director_is_top_level_and_sampling_is_subgraphed():', start)
          if start >= 0:
              if end < 0:
                  raise SystemExit('Could not find end of native workflow test block')
              text = text[:start] + '\n' + text[end:]
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          grep -R --line-number --exclude='_tmp_remove_native_tests.yml' 'H3_Studio_Native_Fast_T2I\|load_native_workflow\|test_native_fast_workflow' tests tools example_workflows || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to change."
            exit 0
          fi
          git commit -m "test(workflows): remove obsolete native fast path coverage"
          git push origin HEAD:release/alpha15-final
